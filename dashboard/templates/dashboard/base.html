{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula 1 Analytics Dashboard</title>
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=1.3">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-title">Analytics F1</span>
            </div>
            
            <nav class="navbar">
                <a href="{% url 'index' %}" 
                   class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                    Overview
                </a>
                
                <a href="{% url 'race_view_results' %}" 
                   class="nav-link {% if request.resolver_match.url_name == 'race_view_results' %}active{% endif %}">
                    Driver Performance
                </a>
                
                <a href="{% url 'race_view_laps' %}" 
                   class="nav-link {% if request.resolver_match.url_name == 'race_view_laps' %}active{% endif %}">
                    Race Pace Analysis
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
